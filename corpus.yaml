# Document corpus for Lighthouse.
# Paths are relative to the repo root. data/ itself is gitignored.
# level: national | operator. scope: operator name for operator documents, null for national.
# source_url: left empty where the publishing address is not known.
# Loader mapping onto the existing documents table:
#   level national -> doc_type general_regulation, hierarchy_priority 1
#   level operator -> doc_type grid_provider_rule, hierarchy_priority 2
#   scope -> grid_provider. issuer and source_url have no column and stay here only.
# Optional max_pages: load only the first N pages.

documents:
  # --- National (VSE industry recommendations) ---
  - path: "data/Werkvorschriften CH (WV - CH 2025).pdf"
    title: "Werkvorschriften CH (WV – CH 2025): Technische Anschlussbedingungen (TAB)"
    issuer: "VSE"
    level: national
    scope: null
    source_url: ""

  - path: "data/NA:EEA-NE7 - CH 2025.pdf"
    title: "NA/EEA-NE7 – CH 2025: Netzanschluss für Energieerzeugungsanlagen an das Niederspannungsnetz"
    issuer: "VSE"
    level: national
    scope: null
    source_url: ""

  - path: "data/Regelung der Einspeisung von Photovoltaikanlagen (NRE - CH 2025).pdf"

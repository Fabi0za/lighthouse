    source_url: "https://www.bkw.ch/fileadmin/user_upload/03_Energie/03_04_Stromnetz/Netzanschluss/BKW_Fachpartner/20250521_DE_Vorgaben_BKW_V1.3.pdf"

  - path: "data/BKW/Technische_Anforderungen_zwecks_Notfallsteuerung_DE.pdf"

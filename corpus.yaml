# Document corpus for Lighthouse: sources and their versions.
# Paths are relative to the repo root. data/ itself is gitignored.
#
# A source is a watched publication; each entry under versions is one file of it,
# listed OLDEST FIRST. The loader promotes them in order, so a later version retires
# an earlier one. Versions are identified by content fingerprint, not by path.
# A source's key never changes: publisher-publication, lowercase, no version or year.
#
# level: national | operator (rank 1 | 2 in the levels table; higher rank wins).
# scopes: where the source applies; required for operator sources, none = applies everywhere.
# address: where the version was published; left out where not known.
# Optional max_pages: load only the first N pages.

sources:
  # --- National (VSE industry recommendations) ---
  - key: vse-wv-ch
    level: national
    versions:
      - path: "data/Werkvorschriften CH (WV - CH 2025).pdf"
        title: "Werkvorschriften CH (WV – CH 2025): Technische Anschlussbedingungen (TAB)"

  - key: vse-na-eea-ne7
    level: national
    versions:
      - path: "data/NA:EEA-NE7 - CH 2025.pdf"
        title: "NA/EEA-NE7 – CH 2025: Netzanschluss für Energieerzeugungsanlagen an das Niederspannungsnetz"

  - key: vse-nre
    level: national
    versions:
      - path: "data/Regelung der Einspeisung von Photovoltaikanlagen (NRE - CH 2025).pdf"
        title: "NRE – CH 2025: Richtlinie für die netzdienliche Regelung der Einspeisung von Photovoltaikanlagen"

  - key: vse-merkblatt-einspeiseregelung
    level: national
    versions:
      - path: "data/BKW/2026-fd-netzdienliche-einspeiseregelung.pdf"
        title: "Netzdienliche Einspeiseregelung: Neue Regeln bei der Einspeisung von Solarstrom (Merkblatt)"

  # --- Operator: BKW ---
  # V1.3 was published under a new file name while V1.2 stayed online at its old address.
  - key: bkw-vorgaben-niederspannung
    level: operator
    scopes: [bkw]
    versions:
      - path: "data/BKW/DE_Vorgaben_BKW_V1.2.pdf"
        title: "Vorgaben an Niederspannungs-Installationen im Verteilnetz der BKW (V1.2, gültig ab 01.03.2025)"
        address: "https://www.bkw.ch/fileadmin/user_upload/03_Energie/03_04_Stromnetz/Netzanschluss/BKW_Fachpartner/DE_Vorgaben_BKW_V1.2.pdf"
      - path: "data/BKW/20250521_DE_Vorgaben_BKW_V1.3.pdf"
        title: "Vorgaben an Niederspannungs-Installationen im Verteilnetz der BKW (V1.3, gültig ab 21.05.2025)"
        address: "https://www.bkw.ch/fileadmin/user_upload/03_Energie/03_04_Stromnetz/Netzanschluss/BKW_Fachpartner/20250521_DE_Vorgaben_BKW_V1.3.pdf"

  - key: bkw-notfallsteuerung
    level: operator
    scopes: [bkw]
    versions:
      - path: "data/BKW/Technische_Anforderungen_zwecks_Notfallsteuerung_DE.pdf"
        title: "Technische Anforderungen zwecks Notfallsteuerung (V1.1, gültig ab 01.02.2025)"

  - key: bkw-faktenblatt-qu-regelung
    level: operator
    scopes: [bkw]
    versions:
      - path: "data/BKW/Faktenblatt_QU-Regelung_A4_DE_def.pdf"
        title: "Faktenblatt Wechselrichter-Einstellung Q(U)-Regelung"

  # Applies to all operators in BE/JU/SO; only BKW is listed until the other scopes are added.
  - key: bejuso-wv
    level: operator
    scopes: [bkw]
    versions:
      - path: "data/BKW/WV_BEJUSO_2025.pdf"
        title: "Werkvorschriften (WV) TAB BE/JU/SO 2025"
        max_pages: 4  # page 1 reads "Seite 1 von 4"; the rest reprints WV - CH 2025

  # --- Operator: EKZ ---
  - key: ekz-parallelbetrieb-eea
    level: operator
    scopes: [ekz]
    versions:
      - path: "data/EKZ/technische-bedingungen-fuer-den-parallelbetrieb-von-eea-fuer-internet-2026.pdf"
        title: "Technische Bedingungen für den Parallelbetrieb von EEA und elektrischen Energiespeichern mit dem EKZ-Netz (Stand Januar 2026)"

  - key: ekz-wv-spezielle-bestimmungen
    level: operator
    scopes: [ekz]
    versions:
      - path: "data/EKZ/wv-ch-2025-spezielle-bestimmungen-ekz-2026-01.pdf"
        title: "Werkvorschriften CH 2025: Spezielle Bestimmungen der EKZ (Version April 2026)"
